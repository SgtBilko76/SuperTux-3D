plugins {
    id 'com.android.application'
}

Properties props = new Properties()
if (rootProject.file("${rootDir}/local.properties").exists()) {
    props.load(rootProject.file("${rootDir}/local.properties").newDataInputStream())
}

final APP_ID = "org.supertux.supertux2"
final TARGET_SDK = 35

// -Pndk_version=<version> or ndk_version=<version> in local.properties
// overrides the NDK used (it has to match the one vcpkg built the
// dependencies with).
final NDK_VERSION = project.hasProperty("ndk_version") ? project.property("ndk_version") : props.getProperty("ndk_version", "29.0.14206865")

// -Popenxr=true (or openxr=true in local.properties) builds the VR
// (Meta Quest) variant, requires the openxr-loader vcpkg port.
final ENABLE_OPENXR = project.hasProperty("openxr") ? project.property("openxr").toString() : props.getProperty("openxr", "false")

// -Pnetworking=false skips the add-on downloader and the libcurl dependency.
final ENABLE_NETWORKING = project.hasProperty("networking") ? project.property("networking").toString() : props.getProperty("networking", "true")

android {
    namespace APP_ID
    compileSdkVersion TARGET_SDK

    defaultConfig {
        applicationId APP_ID
        targetSdkVersion TARGET_SDK

        // FIXME: SuperTux can only run on Android 9 and up.
        // This is because the SDL vcpkg port is attempting to use the system's iconv,
        // which was introduced to Android in Android 9.
        // However, if you attempt to change this minimum SDK version,
        // you get weird libc++ errors that no one wants to deal with.
        // So I'm leaving it like this for now. Sorry.
        // ~ MatusGuy
        minSdkVersion 21

        // NOTE: Don't forget to bump the version code!
        versionCode 7
        versionName "0.7.0"

        ndkVersion NDK_VERSION
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-" + android.compileSdk.toString(),
                          "-DCMAKE_VERBOSE_MAKEFILE=On",
                          "-DANDROID_STL=c++_shared",
                          "-DANDROID=On",
                          "-DSUPERTUX_VCPKG_ROOT=" + props.getProperty("vcpkg_root", ""),
                          "-DSUPERTUX_NDK_HOME=" + props.getProperty("ndk_home", ""),
                          "-DVCPKG_MANIFEST_MODE=OFF",
                          "-DVCPKG_VERBOSE=ON",
                          // OpenGL ES 3 renderer (needed for VR); the game falls
                          // back to the SDL renderer at runtime if it fails.
                          "-DENABLE_OPENGL=ON",
                          "-DENABLE_OPENXR=" + ENABLE_OPENXR,
                          "-DENABLE_NETWORKING=" + ENABLE_NETWORKING,
                          "-DUSE_SYSTEM_SDL2_TTF=ON",
                          "-DANDROID_ALLOW_UNDEFINED_SYMBOLS=OFF", // Literally what the fuck
                          //"--debug-find", // If something isn't being found, uncomment this
                          "--log-level", "TRACE",
                          "-Wno-dev"
                abiFilters rootProject.ext.cpuarch as String[]
            }
            if (rootProject.ext.googleplay) {
                android.defaultConfig.externalNativeBuild.cmake.arguments.add("-DSUPERTUX_GOOGLE_PLAY=ON")
            }
            android.defaultConfig.externalNativeBuild.cmake.arguments.addAll(rootProject.ext.cmake_args)
        }
    }

    if (rootProject.ext.bundle) {
        assetPacks = [":assetpack"]
    } else {
        sourceSets {
            main {
                assets.srcDirs += ['../assetpack/src/main/assets']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Prebuilt native libraries (e.g. from an out-of-gradle CMake build,
    // see README-quest.md) are picked up from app/libs/<abi>/.
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    // -PEXCLUDE_NATIVE_LIBS=1 skips the CMake build and only packages
    // whatever is in app/libs/.
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        externalNativeBuild {
            cmake {
                path '../../../CMakeLists.txt'
            }
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
